<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Creación Usuario SIIS</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .step { display: none; }
    .step.active { display: block; }

    #signature-pad {
      border: 1px solid #999;
      background: #fff;
      display: block;
      margin: auto;
      border-radius: 4px;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
      width: 176px;
      height: 55px;
    }

    @media (max-width: 768px) {
      body { font-size: 0.95rem; }
      .card { padding: 1rem; }
      #signature-pad { width: 100%; height: 150px; }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-4 mb-4">
    <div class="text-center mb-4 p-4 rounded shadow" style="background-color: #4285F4; color: white;">
      <img src="https://www.gstatic.com/images/branding/product/1x/forms_48dp.png" alt="Logo Form" width="48" class="mb-2">
      <h2 class="mb-1">Formulario para la creación de un usuario a SIIS</h2>
      <p>Por favor complete todos los campos obligatorios para registrar correctamente al usuario.</p>
    </div>

    <form id="userForm" class="card shadow p-4">
      <!-- (Tus pasos del formulario son idénticos, no se cambió ningún campo) -->
      <!-- Paso 1 -->
      <div class="step active" id="step1">
        <h5>Datos Básicos</h5>
        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <label class="form-label">Tipo Documento</label>
            <select class="form-select" name="tipoDocumento" required>
              <option value="">Seleccione...</option>
              <option value="CC">Cédula de Ciudadanía</option>
              <option value="CE">Cédula de Extranjería</option>
              <option value="TI">Tarjeta de Identidad</option>
              <option value="PA">Pasaporte</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Documento</label>
            <input type="text" name="documento" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Primer Nombre</label>
            <input type="text" name="primerNombre" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Segundo Nombre</label>
            <input type="text" name="segundoNombre" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Primer Apellido</label>
            <input type="text" name="primerApellido" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Segundo Apellido</label>
            <input type="text" name="segundoApellido" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Sexo</label>
            <select class="form-select" name="sexo" required>
              <option value="">Seleccione...</option>
              <option>Masculino</option>
              <option>Femenino</option>
              <option>Otro</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Paso 2 -->
      <div class="step" id="step2">
        <h5>Ubicación y Contacto</h5>
        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <label class="form-label">País</label>
            <input type="text" name="pais" class="form-control" value="Colombia">
          </div>
          <div class="col-md-4">
            <label class="form-label">Departamento</label>
            <select id="departamentoSelect" name="departamento" class="form-select" required>
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Municipio</label>
            <select id="municipioSelect" name="ciudad" class="form-select" required>
              <option value="">Seleccione departamento primero</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Dirección</label>
            <input type="text" name="direccion" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Celular</label>
            <input type="text" name="celular" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo Personal</label>
            <input type="email" name="correo" class="form-control" required>
          </div>
        </div>
      </div>

      <!-- Paso 3 -->
      <div class="step" id="step3">
        <h5>Datos Académicos</h5>
        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <label class="form-label">Tipo de perfil asistencial ó administrativo</label>
            <select class="form-select" name="tipoProfesional" id="tipoProfesional" required>
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Especialidad</label>
            <select class="form-select" name="especialidad" id="especialidad" required>
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Tarjeta Profesional</label>
            <input type="text" name="tarjetaProfesional" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Institución de educación superior</label>
            <input type="text" name="universidad" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Registro de Salud Dptal</label>
            <input type="text" name="registroSalud" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Intensidad Horaria</label>
            <input type="text" name="intensidadHoraria" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" class="form-control"></textarea>
          </div>
        </div>
      </div>

      <!-- Paso 4 -->
      <div class="step" id="step4">
        <h5>Correo Institucional</h5>
        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <label class="form-label">Estado Correo</label>
            <select class="form-select" name="estadoCorreo" id="estadoCorreo" required>
              <option value="">Seleccione...</option>
              <option>Activo</option>
              <option>Inactivo</option>
              <option>En trámite</option>
              <option>No tengo</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo Univalle</label>
            <input type="email" name="correoUnivalle" id="correoUnivalle" class="form-control">
          </div>
        </div>
      </div>

      <!-- Paso 5 -->
      <div class="step" id="step5">
        <h5>Firma</h5>
        <p class="text-muted">Dibuje su firma en el recuadro o adjunte una imagen.</p>
        <canvas id="signature-pad" width="176" height="55" style="width:100%; max-width:500px; height:200px;"></canvas>
        <div class="mt-2">
          <button type="button" class="btn btn-secondary" id="clearSignature">Limpiar Firma</button>
        </div>
        <hr class="my-3">
        <label class="form-label">Subir Firma (opcional)</label>
        <input type="file" id="signatureFile" accept="image/*" class="form-control mb-2">
        <div id="signaturePreview" class="text-center mt-2"></div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button type="button" class="btn btn-outline-secondary" id="prevBtn">Atrás</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Siguiente</button>
        <button type="submit" class="btn btn-success d-none" id="submitBtn">Enviar</button>
      </div>
    </form>
  </div>

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbxTu_API_ID_AQUI/exec"; // <--- reemplaza esto

let currentStep = 0;
const steps = document.querySelectorAll(".step");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");

function showStep(n) {
  steps.forEach((step, i) => step.classList.toggle("active", i === n));
  prevBtn.style.display = n === 0 ? "none" : "inline-block";
  nextBtn.style.display = n === steps.length - 1 ? "none" : "inline-block";
  submitBtn.classList.toggle("d-none", n !== steps.length - 1);
}

nextBtn.onclick = () => { if (validateStep(currentStep)) showStep(++currentStep); };
prevBtn.onclick = () => showStep(--currentStep);

function validateStep(n) {
  const inputs = steps[n].querySelectorAll("input, select, textarea");
  for (let input of inputs) {
    if (!input.checkValidity()) { input.reportValidity(); return false; }
  }
  return true;
}

// === Cargar datos desde API ===
async function cargarSelect(endpoint, selectId) {
  try {
    const res = await fetch(`${API_BASE}?type=${endpoint}`);
    const data = await res.json();
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">Seleccione...</option>';
    data.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  } catch (err) {
    console.error(`Error cargando ${endpoint}:`, err);
  }
}

cargarSelect("profesional", "tipoProfesional");
cargarSelect("especialidad", "especialidad");

// === Municipios del DANE ===
async function cargarMunicipios() {
  const url = "https://www.datos.gov.co/resource/82di-kkh9.json?$limit=2000";
  const res = await fetch(url);
  const data = await res.json();
  const dptoSelect = document.getElementById("departamentoSelect");
  const mpioSelect = document.getElementById("municipioSelect");

  const daneData = data.map(d => ({
    dpto: d.dpto.trim(),
    nom_mpio: d.nom_mpio.trim()
  }));

  const deptos = [...new Set(daneData.map(d => d.dpto))].sort();
  dptoSelect.innerHTML = '<option value="">Seleccione...</option>';
  deptos.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    dptoSelect.appendChild(opt);
  });

  dptoSelect.onchange = e => {
    const municipios = daneData.filter(d => d.dpto === e.target.value);
    mpioSelect.innerHTML = '<option value="">Seleccione...</option>';
    municipios.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.nom_mpio;
      opt.textContent = m.nom_mpio;
      mpioSelect.appendChild(opt);
    });
  };
}
document.addEventListener("DOMContentLoaded", cargarMunicipios);

// === Firma ===
const canvas = document.getElementById("signature-pad");
const ctx = canvas.getContext("2d");
let drawing = false;
ctx.lineWidth = 1.2;
ctx.lineCap = "round";

canvas.addEventListener("mousedown", e => {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});
canvas.addEventListener("mousemove", e => {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  drawing = true;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (!drawing) return;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
  ctx.stroke();
});
canvas.addEventListener("touchend", () => drawing = false);

document.getElementById("clearSignature").onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);

let uploadedSignature = null;
const fileInput = document.getElementById("signatureFile");
const previewDiv = document.getElementById("signaturePreview");

fileInput.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const temp = document.createElement("canvas");
      temp.width = 176; temp.height = 55;
      const tctx = temp.getContext("2d");
      const scale = Math.min(temp.width/img.width, temp.height/img.height);
      const w = img.width*scale, h = img.height*scale;
      tctx.drawImage(img, (temp.width-w)/2, (temp.height-h)/2, w, h);
      uploadedSignature = temp.toDataURL("image/png");
      previewDiv.innerHTML = `<img src="${uploadedSignature}" style="max-height:55px;border:1px solid #999;">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

// === Enviar formulario ===
document.getElementById("userForm").addEventListener("submit", async e => {
  e.preventDefault();
  const firmaVacia = ctx.getImageData(0,0,canvas.width,canvas.height).data.every(v => v===0);
  if (firmaVacia && !uploadedSignature) {
    Swal.fire("Error", "Debe dibujar o subir su firma antes de enviar.", "error");
    return;
  }

  const formData = Object.fromEntries(new FormData(e.target).entries());
  formData.firma = firmaVacia ? uploadedSignature : canvas.toDataURL("image/png");

  Swal.fire({title:"Enviando...",text:"Por favor espere",allowOutsideClick:false,didOpen:Swal.showLoading});

  try {
    const res = await fetch(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    });
    const msg = await res.text();
    Swal.fire("✅ Éxito", msg, "success");
    e.target.reset();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    previewDiv.innerHTML = "";
    uploadedSignature = null;
    showStep(0);
    currentStep = 0;
  } catch (err) {
    Swal.fire("❌ Error", "No se pudo enviar el formulario.", "error");
  }
});

showStep(currentStep);
</script>
</body>
</html>
